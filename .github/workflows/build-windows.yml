name: Building for Windows

on:
  workflow_dispatch:

env:
  EMBREE_VERSION: 4.4.0
  OIDN_VERSION: 2.3.3
  BUILD_DIR: build
  RUNTIME_DIR: bin

jobs:
  build-for-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v3.28.1
        with:
          cmakeVersion: "3.28.1"
          ninjaVersion: "1.11.1"

      - name: Download Embree from RenderKit
        shell: pwsh
        run: |
          $zip = "embree-$env:EMBREE_VERSION.x64.windows.zip"
          $url = "https://github.com/RenderKit/embree/releases/download/v$env:EMBREE_VERSION/$zip"
          Write-Host "Downloading Embree from: $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath .
          Remove-Item $zip
     
      - name: Create bin/ directory and copy Embree DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:RUNTIME_DIR -Force | Out-Null
          Copy-Item "embree-$env:EMBREE_VERSION.x64.windows\bin\*.dll" -Destination $env:RUNTIME_DIR -Force

      - name: Download and extract OIDN (RenderKit)
        shell: pwsh
        run: |
          $zip = "oidn-$env:OIDN_VERSION.x64.windows.zip"
          $url = "https://github.com/RenderKit/oidn/releases/download/v$env:OIDN_VERSION/$zip"
          Write-Host "Downloading OIDN from: $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath . -Force
          Remove-Item $zip
          New-Item -ItemType Directory -Path "thirdparty/oidn" -Force | Out-Null
          Copy-Item "oidn-$env:OIDN_VERSION.x64.windows/*" -Destination "thirdparty/oidn" -Recurse -Force

      - name: Build
        shell: pwsh
        run: |
          cmake -B $env:BUILD_DIR -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/$env:RUNTIME_DIR" `
            -DEMBREE_LOCATION="$PWD/embree-$env:EMBREE_VERSION.x64.windows"
          cmake --build $env:BUILD_DIR --config Release --parallel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: etx-tracer-windows
          path: |
            bin/
            bin/*.exe
